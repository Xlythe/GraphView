// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        // com.xlythe:math-library comes from the MathLibrary repo. Until the version this needs is
        // on Maven Central, run `gradlew :math-library:publishToMavenLocal` there.
        mavenLocal()
        mavenCentral()
        google()
    }
}
